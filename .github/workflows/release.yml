# Sole GitHub workflow: verify + package + publish on tag vX.Y.Z whose commit is on main.
# Ordinary pushes to main do not run Actions — local gate is: bash scripts/ci-cd.sh check
# See docs/CI_CD.md
name: Relay Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
concurrency:
  group: relay-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require tag commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA which is not on main — refuse release"
            exit 1
          }
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Match tag to VERSION.md
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE="$(tr -d ' \t\r\n' <VERSION.md)"
          GO_VER="$(sed -n 's/^const relayVersion = "\([^"]*\)"/\1/p' version.go)"
          [[ "$VERSION" == "$SOURCE" ]] || {
            echo "Tag v$VERSION must match VERSION.md ($SOURCE)"
            exit 1
          }
          [[ "$SOURCE" == "$GO_VER" ]] || {
            echo "VERSION.md ($SOURCE) != version.go ($GO_VER)"
            exit 1
          }
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test -race -count=1 ./...
      - name: Package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          bash scripts/package-linux.sh
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --generate-notes \
            --title "Infrasible Relay v$VERSION" \
            --target "$GITHUB_SHA"
